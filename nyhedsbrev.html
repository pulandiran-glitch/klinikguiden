<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyhedsbrev | KlinikGuiden</title>
  <meta name="description" content="Tilmeld KlinikGuidens nyhedsbrev og få korte, patientvenlige guides om tænder, behandlinger og priser." />
  <link rel="canonical" href="https://klinikguiden.com/nyhedsbrev.html" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--cream:#F5F0E8;--warm-white:#FDFAF5;--sage-dark:#4E7A62;--charcoal:#2C2C2C;--muted:#7A7A72;--border:#E2DDD4}
    body{background:var(--warm-white);color:var(--charcoal);font-family:Inter,sans-serif;line-height:1.7}main{margin:0 auto;max-width:720px;padding:5rem 2rem}.panel{background:white;border:1px solid var(--border);border-radius:16px;padding:2rem}.eyebrow{color:var(--sage-dark);font-size:.75rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase}h1{font-family:"Playfair Display",serif;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.15;margin:1rem 0}p{color:var(--muted)}form{display:grid;gap:1rem;margin-top:2rem}.field{border:1px solid var(--border);border-radius:8px;font:inherit;padding:.85rem}.consent{align-items:flex-start;display:flex;font-size:.9rem;gap:.65rem}.button{background:var(--sage-dark);border:0;border-radius:100px;color:white;cursor:pointer;font:inherit;font-weight:500;padding:.85rem 1.5rem}.button:disabled{opacity:.7;cursor:wait}.form-status{border-radius:8px;display:none;font-size:.9rem;padding:.75rem}.form-status.show{display:block}.form-status.info{background:#eef6f1;color:#315541}.form-status.success{background:#eef6f1;color:#315541}.form-status.error{background:#fbeeee;color:#8a2f2f}.honeypot{display:none}a{color:var(--sage-dark)}.links{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.5rem}
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <p class="eyebrow">Nyhedsbrev</p>
      <h1>Få korte guides i din indbakke</h1>
      <p>Vi sender rolige, konkrete forklaringer om tandpleje, behandlinger, priser og spørgsmål før tandlægebesøg.</p>
      <form id="newsletterForm" name="newsletter-signup" method="POST" action="/tak.html" data-netlify="true" netlify-honeypot="bot-field" data-signup-page="/nyhedsbrev.html" data-signup-form="Nyhedsbrevside">
        <input type="hidden" name="form-name" value="newsletter-signup" />
        <input type="hidden" name="created_at" id="createdAt" value="" />
        <input type="hidden" name="consent_text" value="Jeg accepterer at modtage nyheder og guides fra KlinikGuiden på e-mail. Jeg kan altid afmelde mig igen." />
        <input type="hidden" name="consent_source" value="KlinikGuiden newsletter-signup" />
        <input type="hidden" name="double_opt_in_status" value="pending" />
        <p class="honeypot"><label>Udfyld ikke dette felt: <input name="bot-field" /></label></p>
        <input class="field" type="text" name="name" placeholder="Dit navn" autocomplete="name" required />
        <input class="field" type="email" name="email" placeholder="Din e-mail" autocomplete="email" required />
        <label class="consent"><input type="checkbox" name="consent" value="accepted" required /><span>Jeg accepterer at modtage nyheder og guides fra KlinikGuiden på e-mail. Jeg kan altid afmelde mig igen.</span></label>
        <button class="button" type="submit">Tilmeld nyhedsbrev</button>
        <div class="form-status" id="newsletterStatus" role="status" aria-live="polite"></div>
      </form>
      <p style="font-size:.85rem;margin-top:1rem;">Vi bruger kun dit navn og din e-mail til nyheder fra KlinikGuiden. Du kan afmelde dig når som helst.</p>
      <div class="links">
        <a href="/">Til forsiden</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="privatlivspolitik.html">Privatlivspolitik</a>
      </div>
    </div>
  </main>
  <script>
    const form = document.getElementById('newsletterForm');
    const createdAt = document.getElementById('createdAt');
    const status = document.getElementById('newsletterStatus');

    function setStatus(message, type) {
      status.textContent = message;
      status.className = `form-status show ${type}`;
    }

    function setSubmitting(isSubmitting) {
      const button = form.querySelector('button[type="submit"]');
      button.disabled = isSubmitting;
    }

    async function submitNetlifyBackup() {
      const backupData = new FormData(form);
      await fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(backupData).toString()
      });
    }

    createdAt.value = new Date().toISOString();

    form.addEventListener('submit', async (event) => {
      if (!form.checkValidity()) return;
      event.preventDefault();

      const consent = form.querySelector('input[name="consent"]');
      if (!consent.checked) {
        setStatus('Du skal aktivt acceptere nyhedsbrevet, før formularen kan sendes.', 'error');
        return;
      }

      if (!createdAt.value) {
        createdAt.value = new Date().toISOString();
      }

      const formData = new FormData(form);
      const payload = {
        name: formData.get('name') || '',
        email: formData.get('email') || '',
        consent: formData.get('consent') || '',
        consent_text: formData.get('consent_text') || '',
        consent_source: formData.get('consent_source') || 'KlinikGuiden newsletter-signup',
        consent_timestamp: formData.get('created_at') || new Date().toISOString(),
        signup_page: form.dataset.signupPage || window.location.pathname,
        signup_form: form.dataset.signupForm || 'newsletter-signup',
        double_opt_in_status: formData.get('double_opt_in_status') || 'pending',
        'bot-field': formData.get('bot-field') || ''
      };

      try {
        setSubmitting(true);
        setStatus('Sender din tilmelding...', 'info');
        const response = await fetch('/.netlify/functions/brevo-newsletter-signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Tilmeldingen kunne ikke gennemføres.');
        }

        submitNetlifyBackup().catch(() => {});
        form.reset();
        createdAt.value = new Date().toISOString();
        setStatus(data.message || 'Tak for tilmeldingen.', 'success');
      } catch (error) {
        setStatus(error.message || 'Der opstod en fejl. Prøv igen om lidt.', 'error');
      } finally {
        setSubmitting(false);
      }
    });
  </script>
</body>
</html>
