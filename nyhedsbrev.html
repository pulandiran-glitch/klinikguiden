<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyhedsbrev | KlinikGuiden</title>
  <meta name="description" content="Tilmeld KlinikGuidens nyhedsbrev og få korte, patientvenlige guides om tænder, behandlinger og priser." />
  <link rel="canonical" href="https://klinikguiden.com/nyhedsbrev.html" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--cream:#F5F0E8;--warm-white:#FDFAF5;--sage-dark:#4E7A62;--charcoal:#2C2C2C;--muted:#7A7A72;--border:#E2DDD4}
    body{background:var(--warm-white);color:var(--charcoal);font-family:Inter,sans-serif;line-height:1.7}main{margin:0 auto;max-width:720px;padding:5rem 2rem}.panel{background:white;border:1px solid var(--border);border-radius:16px;padding:2rem}.eyebrow{color:var(--sage-dark);font-size:.75rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase}h1{font-family:"Playfair Display",serif;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.15;margin:1rem 0}p{color:var(--muted)}form{display:grid;gap:1rem;margin-top:2rem}.field{border:1px solid var(--border);border-radius:8px;font:inherit;padding:.85rem}.consent{align-items:flex-start;display:flex;font-size:.9rem;gap:.65rem}.button{background:var(--sage-dark);border:0;border-radius:100px;color:white;cursor:pointer;font:inherit;font-weight:500;padding:.85rem 1.5rem}.honeypot{display:none}a{color:var(--sage-dark)}
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <p class="eyebrow">Nyhedsbrev</p>
      <h1>Få korte guides i din indbakke</h1>
      <p>Vi sender rolige, konkrete forklaringer om tandpleje, behandlinger, priser og spørgsmål før tandlægebesøg.</p>
      <form name="newsletter-signup" method="POST" action="/tak.html" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="newsletter-signup" />
        <input type="hidden" name="created_at" id="createdAt" value="" />
        <p class="honeypot"><label>Udfyld ikke dette felt: <input name="bot-field" /></label></p>
        <input class="field" type="text" name="name" placeholder="Dit navn" autocomplete="name" required />
        <input class="field" type="email" name="email" placeholder="Din e-mail" autocomplete="email" required />
        <label class="consent"><input type="checkbox" name="consent" value="accepted" required /><span>Jeg accepterer at modtage nyheder og guides fra KlinikGuiden på e-mail. Jeg kan altid afmelde mig igen.</span></label>
        <button class="button" type="submit">Tilmeld nyhedsbrev</button>
      </form>
      <p style="font-size:.85rem;margin-top:1rem;">Vi bruger kun din e-mail til nyheder fra KlinikGuiden. Du kan afmelde dig når som helst.</p>
      <p style="margin-top:1rem;"><a href="/">Til forsiden</a></p>
    </div>
  </main>
  <script>document.getElementById('createdAt').value = new Date().toISOString();</script>
</body>
</html>
