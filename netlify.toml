[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.klinikguiden.com/*"
  to = "https://klinikguiden.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.klinikguiden.com/*"
  to = "https://klinikguiden.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/rodbehandling"
  to = "/rodbehandling.html"
  status = 200

[[redirects]]
  from = "/regningen"
  to = "/regningen.html"
  status = 200

[[redirects]]
  from = "/tandlaegeangst"
  to = "/tandlaegeangst.html"
  status = 200

[[redirects]]
  from = "/boern"
  to = "/boern.html"
  status = 200

[[redirects]]
  from = "/besoegsfrekvens"
  to = "/besoegsfrekvens.html"
  status = 200

[[redirects]]
  from = "/bedoevelse"
  to = "/bedoevelse.html"
  status = 200

[[redirects]]
  from = "/guide-komplette"
  to = "/guide-komplette.html"
  status = 200

[[redirects]]
  from = "/privatliv"
  to = "/privatliv.html"
  status = 200

[[redirects]]
  from = "/tak"
  to = "/tak.html"
  status = 200

[[redirects]]
  from = "/tjekliste"
  to = "/tjekliste_tandlaegebesoeg.pdf"
  status = 200
